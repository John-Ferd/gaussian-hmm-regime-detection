[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "gaussian-hmm-regime-detection"
version = "0.1.0"
description = "Gaussian HMM (forward-backward, Viterbi, Baum-Welch) for market regime detection"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scipy", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "hmmlearn"]
real-data = ["yfinance"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E402"]
